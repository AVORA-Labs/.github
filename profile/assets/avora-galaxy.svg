<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">AVORA Labs — technology with perspective</title>
  <desc id="description">AVORA Labs wordmark beside a layered, luminous planetary form with orbital lines representing connected software, data and operations.</desc>
  <defs>
    <linearGradient id="space" x2="1" y2="1">
      <stop stop-color="#0c151b"/>
      <stop offset="0.6" stop-color="#101821"/>
      <stop offset="1" stop-color="#1c1b21"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" x2="1">
      <stop stop-color="#67d7cb" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#67d7cb" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d6af76" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.27" r="0.85">
