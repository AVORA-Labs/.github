      <stop offset="0.42" stop-color="#eac390" stop-opacity="0.8"/>
      <stop offset="0.72" stop-color="#83dacb" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#83dacb" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" x2="1">
      <stop stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#cfdfd9"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="904" cy="205" r="116"/></clipPath>
  </defs>

