      <stop offset="0.2" stop-color="#55c7b9"/>
      <stop offset="0.58" stop-color="#196c75"/>
      <stop offset="0.84" stop-color="#223344"/>
      <stop offset="1" stop-color="#0e1b29"/>
    </radialGradient>
    <radialGradient id="atmosphere">
      <stop offset="0.62" stop-color="#2fb7ac" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#58d9c7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#58d9c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
