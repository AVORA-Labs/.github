<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">AVORA — A Vision of Radiant Advancement</title>
  <desc id="description">A coded brand horizon with five connected points representing Advance, Vision, Operations, Results, and Adapt.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1">
      <stop stop-color="#061417"/>
      <stop offset="0.58" stop-color="#0b2527"/>
      <stop offset="1" stop-color="#173032"/>
    </linearGradient>
    <radialGradient id="dawn" cx="76%" cy="48%" r="44%">
      <stop stop-color="#e1ba79" stop-opacity="0.42"/>
      <stop offset="0.2" stop-color="#5dd2b8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#071719" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x2="1">
      <stop stop-color="#f4f8f5"/>
      <stop offset="1" stop-color="#bdd8d0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="10" fill="url(#sky)"/>
  <rect width="1200" height="420" rx="10" fill="url(#dawn)"/>
  <g fill="#c4e6dd" opacity="0.45">
    <circle cx="80" cy="65" r="1"/><circle cx="221" cy="335" r="1.2"/><circle cx="386" cy="70" r="1"/>
    <circle cx="566" cy="356" r="1"/><circle cx="694" cy="82" r="1.2"/><circle cx="1040" cy="64" r="1"/>
    <circle cx="1132" cy="310" r="1.2"/><circle cx="922" cy="352" r="1"/>
  </g>
  <g stroke="#75cbb8" stroke-opacity="0.16" fill="none">
    <path d="M540 420Q735 288 908 198M715 420Q807 286 908 198M895 420Q892 286 908 198M1070 420Q980 286 908 198"/>
    <path d="M0 322H1200M0 372H1200"/>
  </g>
  <path d="M0 284H1200" stroke="#d8b276" stroke-opacity="0.42"/>
  <g font-family="Arial, sans-serif">
    <text x="62" y="80" fill="#b2ccc5" font-size="12">A VISION OF RADIANT ADVANCEMENT</text>
    <text x="58" y="205" fill="url(#word)" font-family="Georgia, serif" font-size="84" font-weight="bold">AVORA</text>
    <text x="64" y="250" fill="#dfb97e" font-size="25">LABS</text>
    <text x="62" y="330" fill="#e8f2ee" font-size="22">Clarity for what comes next.</text>
    <text x="62" y="363" fill="#9bb8b1" font-size="12">SOFTWARE  /  DATA  /  MANAGEMENT</text>
  </g>
  <g transform="translate(908 198)">
    <circle r="116" fill="none" stroke="#76cfbb" stroke-opacity="0.34"/>
    <circle r="78" fill="none" stroke="#d9b77e" stroke-opacity="0.42"/>
    <circle r="34" fill="#0d2b2d" stroke="#e2c28a" stroke-opacity="0.72"/>
    <text x="0" y="5" fill="#f0f7f3" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">AVORA</text>
    <g font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      <g transform="translate(0 -116)"><circle r="18" fill="#0b2426" stroke="#b6d9cf"/><text y="4" fill="#f0cf96">A</text><text y="35" fill="#a9c4bd" font-size="8">ADVANCE</text></g>
      <g transform="translate(110 -36)"><circle r="18" fill="#0b2426" stroke="#b6d9cf"/><text y="4" fill="#f0cf96">V</text><text y="35" fill="#a9c4bd" font-size="8">VISION</text></g>
      <g transform="translate(68 94)"><circle r="18" fill="#0b2426" stroke="#b6d9cf"/><text y="4" fill="#f0cf96">O</text><text y="35" fill="#a9c4bd" font-size="8">OPERATIONS</text></g>
      <g transform="translate(-68 94)"><circle r="18" fill="#0b2426" stroke="#b6d9cf"/><text y="4" fill="#f0cf96">R</text><text y="35" fill="#a9c4bd" font-size="8">RESULTS</text></g>
      <g transform="translate(-110 -36)"><circle r="18" fill="#0b2426" stroke="#b6d9cf"/><text y="4" fill="#f0cf96">A</text><text y="35" fill="#a9c4bd" font-size="8">ADAPT</text></g>
    </g>
